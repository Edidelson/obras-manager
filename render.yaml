# ============================================================
# Banco de dados: migrado para o Neon (Postgres serverless).
# As credenciais são definidas manualmente no dashboard do Render
# (Environment), por isso os envVars de banco usam `sync: false`.
#
# O banco antigo do Render (obramanager-db) foi removido deste
# blueprint. Ele NÃO é excluído automaticamente — apague pelo
# dashboard só depois de confirmar que o Neon está funcionando.
# ============================================================

services:
  - type: web
    name: obramanager-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/obra-api/Dockerfile
    dockerContext: ./backend/obra-api
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # ── Neon (definir os valores no dashboard do Render) ──
      # DB_HOST: usar o endpoint DIRETO (sem o sufixo "-pooler"),
      # ex.: ep-xxxx-123456.us-east-2.aws.neon.tech
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_UPLOAD_DIR
        value: /app/uploads
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
