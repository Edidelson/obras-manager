plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.obramanager'
version = '1.0.0'
description = 'ObraManager — API de Gestão de Obras Residenciais'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
    mapstructVersion = '1.5.5.Final'
    springdocVersion = '2.5.0'
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database
    // Versão fixada (o Spring Boot 3.3.1 traz a 42.7.3): a 42.7.3 usa uma lib
    // SCRAM antiga que rejeita o handshake do Neon com
    // "Argument 'iteration must be >= 4096' is not valid".
    // A 42.7.12 também corrige o CVE-2026-54291 (downgrade de channel binding).
    runtimeOnly 'org.postgresql:postgresql:42.7.12'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Serialização correta de entidades JPA com relações lazy (evita o erro
    // "No serializer found for ... HibernateProxy" ao retornar entidades direto nos controllers)
    // Versão gerenciada pelo BOM do Spring Boot (mesma versão do jackson-databind do projeto).
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // OpenAPI / Swagger
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Apache POI (Excel)
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // iText PDF
    implementation 'com.itextpdf:itext7-core:8.0.4'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:1.20.1"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
