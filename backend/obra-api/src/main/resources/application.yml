spring:
  application:
    name: obra-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:wnawmkvdigwigepeenru.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:a2YxxoZRILDFpkkC}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          fetch_size: 50
          batch_size: 20

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:obra-manager-super-secret-key-2024-change-in-production}
  expiration: 3600000        # 1 hora em ms
  refresh-expiration: 604800000  # 7 dias em ms

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.obramanager: DEBUG
    org.springframework.security: WARN
